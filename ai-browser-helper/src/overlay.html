<!-- src/overlay.html -->
<div class="ai-overlay">
  <div class="ai-panel">
    <div class="ai-header">
      <div class="ai-title">AI Helper</div>
      <div class="ai-actions">
        <button class="ai-chip" data-action="explain">Explain page</button>
        <button class="ai-chip" data-action="summarize">Summarize</button>
        <button class="ai-gear" title="Settings" data-action="settings">⚙</button>
        <button class="ai-close" title="Close" data-action="close">×</button>
      </div>
    </div>
    <div class="ai-messages" id="ai-messages"></div>
    <div class="ai-input-bar">
      <input id="ai-input" type="text" placeholder="Ask about this page..." />
      <button id="ai-send">Send</button>
    </div>
  </div>
</div>
