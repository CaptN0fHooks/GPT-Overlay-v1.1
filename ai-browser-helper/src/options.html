<!-- src/options.html -->
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI Browser Helper - Settings</title>
    <style>
      body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #0f172a; padding: 28px; }
      .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; max-width: 560px; box-shadow: 0 6px 18px rgba(15,23,42,0.08); }
      label { font-weight: 600; display: block; margin-bottom: 8px; }
      input[type="password"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; }
      button { margin-top: 12px; padding: 12px 16px; background: #111827; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
      button:hover { background: #0f172a; }
      .status { margin-top: 10px; color: #16a34a; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>AI Browser Helper Settings</h2>
      <p>Add your OpenAI API key so the helper can talk to you. Your key stays on this device.</p>
      <label for="apiKey">OpenAI API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
      <button id="save">Save</button>
      <div class="status" id="status"></div>
    </div>
    <script type="module" src="./options.js"></script>
  </body>
</html>
